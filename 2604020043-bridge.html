<script id="forth" type="text/javascript">
// github:chocain/eforthjs616
// modifications by inscript

// dict is an global array that hold objects, each object can hold:
// name - the string name of the word
// xt - execution token -> the javascript logic, or the param field if no prims in xt
// the param field is threaded code
// pf - an array of further word objects to execute - the thread of forth instructions
// q - an array of data items (often used for storing literal values, strings, etc.)
// val - each immediate word links a new words val to the newly created code object's q
// whenevre you do @, !, n@, n!, etc. you're indexing into the dict[...] entry's val array, so the dictionary itself is being used as a big "map" (by int index in dict) from word name -> value array
// there is no separate, typed array or linear memory region, each data structure in this impl is just a property in the dict array -> this means that the forth VM is letting js handle memory
// these forth data structures are all placeholders that reference properties in these javascript objects -> hence no memory optimizations on the forth side
// so as they are currently implemented, variable, constant, etc. ae just sugar over the same underlying mechanism: "make a new dict entry with a single-element array to hold the data"
'use strict';
window.ForthVM = function(outputCallback) {
    let SPC=' ', CR='\n', EPS=1.0e-6;
    let startTimeVar = 0, endTimeVar = 0;
    let _WST    = [];
    let _RST    = [];
    let _base   = 10; 
    let _compi  = false;
    let _ucase  = false;
    let _tib    = '', _ntib = 0;
    let _fence  = 0;
    let outputBuffer = []; // Collect output here instead of console.log
    let startupOutputBuffer = []; // Temporary buffer for startup script output

    // Replacing direct log calls with a buffered log function
const log = (s) => {
    if (startupOutputBuffer) {
        startupOutputBuffer.push(s); // Buffer startup output
    } else {
        outputBuffer.push(s);
        // Restore callback invocation so output appears
        if (outputCallback) outputCallback(s);
    }
};

    
    const NA  = (s)=>s+' not found! ';
    const word= (d=SPC)=>{
        while (d==SPC && (_tib[_ntib]==SPC || _tib[_ntib]=='\t')) _ntib++;
        let i = _tib.indexOf(d, _ntib);
        let s = (i==-1) ? (_tib='',null) : _tib.substring(_ntib, i);
        _ntib = i+1;
        return s;
    };
    const dot_r = (n, v)=>{
        let s = v.toString(_base);
        for(let i=0; i+s.length < n; i++) log(SPC);
        log(s);
    };
    const sleep=(ms)=> new Promise(RST=>setTimeout(RST,ms));

    const INT    = v=>(v | 0);
    const UINT   = v=>(v >>> 0);
    const BOOL   = t=>(t ? -1 : 0); // true/false values here
    const ZERO   = v=>BOOL(Math.abs(v) < EPS);
    const top    = (n=1)=>_WST.at(-INT(n));
    const push   = v=>_WST.push(v);
    const pop    = () => {
        if (_WST.length === 0) {
            throw 'Error: stack underflow';
        }
        return _WST.pop();
    };
    const grab   = n=>{ let v=top(n); _WST.splice(_WST.length - INT(n), 1); return v; };
    const dec_i  = () =>_RST[_RST.length - 1] -= 1;

    const _docon = c=>push(c.q[0]);
    const _dovar = c=>push(c.token);
    const _dolit = c=>push(c.q[0]);
    const _dotstr= c=>log(c.q[0]);
    const _dostr = c=>{
        let s = dict[c.token >> 16].pf[c.token & 0xffff].q[0];
        push(s); push(s.length);
    };
    const _tor   = c=>_RST.push(pop());
    const _bran  = c=>_run(ZERO(pop()) ? c.p1 : c.pf);

    const _run = p=>{
        try { p.forEach(w=>w.exec()) } catch {}
    };

    const _cycle = c=>{
        while (true) {
            _run(c.pf);
            if (c.stage==0 && INT(pop())!=0) break;
            if (c.stage==1) continue;
            if (c.stage==2 && ZERO(pop())) break;
            _run(c.p1);
        }
    };

    const _dofor = c=>{
        do { _run(c.pf) } while (c.stage==0 && dec_i() >= 0);
        while (c.stage>0) {
            _run(c.p2);
            if (dec_i() < 0) break;
            _run(c.p1);
        }
        _RST.pop();
    };
    const _does  = c=>{
        let hit = false;
        dict[c.token].pf.forEach(w=>{
            if (hit) dict.at(-1).pf.push(w);
            if (w.name=='_does') hit = true;
        });
        throw '_does'
    };

    const _spaces= (n=1)=>{ for (let i=0; i<n; i++) log(SPC) };

    const _words = () => {
        const terminalWidth = 40;
        const maxWordLength = dict.reduce((max, w) => Math.max(max, w.name.length), 0);
        const columnWidth = maxWordLength + 2;
        const numColumns = Math.floor(terminalWidth / columnWidth) || 1;
        let output = '';

        dict.forEach((w, index) => {
            let wordStr = w.name.padEnd(columnWidth, ' ');
            output += wordStr;
            if ((index + 1) % numColumns === 0) {
                output = output.trimEnd();
                output += CR;
            }
        });
        if (!output.endsWith(CR)) {
            output = output.trimEnd();
           // output += CR;
        }
        log(output);
    };

    const _dump = (idx, n)=>{
        for (let i=INT(idx); i < INT(idx+n); i++) {
            if (i >= dict.length) break;
            let w = dict[i];
            log('['+i+(w.immd ? ']*=' : ']="') + w.name + '", ');
            if (w.xt) log(w.xt);
            else      log('pf='+JSON.stringify(w.pf));
            //log(CR);
        }
    };
    const _see = (w, n=0)=>{
        const iden = (n, s)=>{ log(CR); _spaces(2*n); log(s) };
        const show = (hdr, pf)=>{
            if (pf == null || pf.length == 0) return;
            if (hdr!='') iden(n, hdr);
            iden(n+1, '');
            pf.forEach(w1=>_see(w1, n+1));
        };
        let cn = w.pf!=null && w.pf.length>0;
        log(' '+w.name+(cn ? ' {' : ''));
        if (w.q != null) {
            let qn = w.q.length;
            if (qn > 1) log(JSON.stringify(w.q));
            else {
                log(w.q[0].toString());
                if (typeof(w.q[0])=='string') log('"');
            }
        }
        if (w.xt && n==0) {
            log(' { '+w.xt+' } ');
            return;
        }
        let bn = w.stage==2 ? ' _while' : (w.stage==3 ? ' _aft' : ' _else');
        show('', w.pf);
        show(bn, w.p1);
        show(' _then', w.p2);
        if (cn) log(' }');
    };

    class Prim {
        constructor(name, xt) {
            this.name  = name;
            this.xt    = xt;
            this.immd  = false;
            this.token = _fence++;
        }
        exec() { this.xt(this) }
    }
    class Immd extends Prim {
        constructor(name, xt) { super(name, xt); this.immd=true }
    }
    class Code {
        constructor(name, xt, v=false) {
            this.name  = name;
            this.xt    = xt;
            this.immd  = false;
            this.pf    = [];
            if (typeof(v)=='boolean' && v) {
                this.token = _fence++;
            } else if (typeof(v)=='string') this.q = [ v ];
            else if (typeof(v)=='number') this.q = [ v ];
        }
        exec() {
            if (this.xt == null) _run(this.pf);
            else this.xt(this);
        }
    }

    const compile= (w)=>dict.at(-1).pf.push(w);
    const nvar   = (xt, v)=>{
        let t = dict.at(-1);
        let w = new Code('', xt, v);
        t.val   = w.q;
        w.token = t.token;
        compile(w);
    };
    const find   = (s)=>{
        for (let i=dict.length-1; i>=0; --i) {
            if (s.localeCompare(
                dict[i].name, undefined,
                { sensitivity: _ucase ? 'case' : 'base' }
            )==0) {
                return dict[i];
            }
        }
        return null;
    };
    const tok2w  = ()=>{
        let s=word();
        if (s==null) { log('name? '); throw 'need name' }
        let w = find(s);
        if (w==null) throw NA(s);
        return w;
    };
    const isNum = (s)=>{
        const mx = (c)=>c+'-'+String.fromCharCode(c.charCodeAt() + (_base - 11));
        const st = _base > 10
              ? '^-?[0-9|'+mx('a')+'|'+mx('A')+']+$'
              : '^-?([0-'+(_base-1).toString()+']*[.])?[0-'+(_base-1).toString()+']+$';
        return new RegExp(st).test(s);
    };
    const merge = (dst, src)=>{ dst.push(...src); src.length = 0 };

    let dict = [
        new Prim('dup',   c=>push(top(1))),
        new Prim('drop',  c=>pop()),
        new Prim('over',  c=>push(top(2))),
        new Prim('swap',  c=>push(grab(2))),
        new Prim('rot',   c=>push(grab(3))),
        new Prim('pick',  c=>{ let i=pop(), n=top(i+1); push(n) }),
        new Prim('roll',  c=>{ let i=pop(), n=grab(i+1); push(n) }),
        new Prim('nip',   c=>grab(2)),
        new Prim('+',     c=>{ let n=pop(); push(pop() + n) }),
        new Prim('-',     c=>{ let n=pop(); push(pop() - n) }),
        new Prim('*',     c=>{ let n=pop(); push(pop() * n) }),
        new Prim('/',     c=>{ let n=pop(); push(pop() / n) }),
        new Prim('mod',   c=>{ let n=pop(); push(pop() % n) }),
        new Prim('divmod',c=>{ let n=pop(), m=pop(); 
                               push((m / n)); push(m % n)}),
        new Prim('*/',    c=>{ let n=pop(); push(pop() * pop() / n) }),
        new Prim('*/mod', c=>{
            let n=pop(), m=pop() * pop();
            push(m % n); push(INT(m / n))
        }),
        new Prim('int',   c=>push(INT(pop()))),
        new Prim('and',   c=>push(pop() & pop())),
        new Prim('or',    c=>push(pop() | pop())),
        new Prim('xor',   c=>push(pop() ^ pop())),
        new Prim('negate',c=>push(-pop())),
        new Prim('invert',c=>push(~pop())),
        new Prim('abs',   c=>push(Math.abs(pop()))),
        new Prim('rshift',c=>{ let n=pop(); push(pop() >> n) }),
        new Prim('lshift',c=>{ let n=pop(); push(pop() << n) }),
        new Prim('shift', c => {
		    let n = pop(); // Pop the number of positions to shift
    		if (n === 0) { return;} else if (n > 0) {
        	push(pop() >> n); } else {
        	push(pop() << (-n));}}),
        new Prim('=',     c=>{ let n=pop(); push(ZERO(pop() - n)) }),
        new Prim('<',     c=>{ let n=pop(); push(BOOL((pop() - n) < -EPS)) }),
        new Prim('>',     c=>{ let n=pop(); push(BOOL((pop() - n) >  EPS)) }),
        new Prim('uint', c => push(UINT(pop()))),
        // new Prim('ucase!',c=>_ucase=BOOL(ZERO(pop()))),
        // new Prim('base@', c=>push(INT(_base))),
        // new Prim('base!', c=>_base=INT(pop())),
        // new Prim('decimal',c=>_base=10),
        // new Prim('hex',   c=>_base=16),
        new Prim('bl',    c=>log(SPC)),
        new Prim('cr',    c=>log(CR)),
        new Prim('.',     c=>log(pop().toString(_base)+SPC)),
        new Prim('u.',    c=>log(UINT(pop()).toString(_base)+SPC)),
        new Prim('.r',    c=>{ let n=pop(); dot_r(n, pop()) }),
        new Prim('u.r',   c=>{ let n=pop(); dot_r(n, UINT(pop())) }),
        new Prim('key',   c=>push(word()[0])),
        new Prim('emit',  c=>log(String.fromCharCode(pop()))),
        new Prim('space', c=>log(SPC)),
        new Prim('spaces',c=>_spaces(pop())),
        new Prim('type',  c=>{ let len=pop(); let str=pop(); log(str.substring(0, len)) }),
        new Immd('."',    c=>{
            let s = word('"');
            if (s==null) { log('one quote? '); return }
            if (_compi) compile(new Code('." ', _dotstr, s))
            else log(s)
        }),
        new Immd('s"',    c=>{
            let s = word('"');
            if (s==null) { log('one quote? '); return }
            if (_compi) {
                let w = new Code('s" ', _dostr, s);
                let n = dict.at(-1);
                w.token = (n.token<<16) | n.pf.length;
                compile(w);
            }
            else { push(s); push(s.length) }
        }),
        new Immd('(',     c=>word(')')),
        new Immd('.(',    c=>log(word(')'))),
        new Immd('\\',    c=>_ntib=_tib.length),
        new Immd('if',    c=>{
            let w = new Code('_if', _bran, false)
            compile(w); w.p1=[]; w.stage=0
            dict.push(new Code(' tmp'))
        }),
        new Immd('else',  c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.pf, tmp.pf); w.stage=1
        }),
        new Immd('then',  c=>{
            let w=dict.last(), tmp=dict.at(-1)
            if (w.stage==0) {
                merge(w.pf, tmp.pf)
                dict.pop()
            }
            else {
                merge(w.p1, tmp.pf)
                if (w.stage==1) dict.pop()
            }
        }),
        new Immd('begin', c=>{
            let w = new Code('_begin', _cycle, false)
            compile(w); w.p1=[]; w.stage=0
            dict.push(new Code(' tmp'))
        }),
        new Immd('while', c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.pf, tmp.pf); w.stage=2
        }),
        new Immd('repeat', c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.p1, tmp.pf); dict.pop()
        }),
        new Immd('again', c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.pf, tmp.pf); dict.pop(); w.stage=1
        }),
        new Immd('until', c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.pf, tmp.pf); dict.pop()
        }),
        new Immd('for',   c=>{
            compile(new Code('>r', _tor, false));
            let w = new Code('_for', _dofor, false)
            compile(w); w.p1=[]; w.stage=0
            dict.push(new Code(' tmp'))
        }),
        new Immd('aft',   c=>{
            let w=dict.last(), tmp=dict.at(-1)
            merge(w.pf, tmp.pf); w.p2=[]; w.stage=3
        }),
        new Immd('next', c => {
            if (_RST.length < 2) {
                log('Error: Return stack underflow in next');
                throw 'Return stack underflow';
            }

            let loopCounter = _RST.pop();
            let loopLimit = _RST.pop();

            loopCounter += 1;
            if (loopCounter < loopLimit) {
                _RST.push(loopLimit);
                _RST.push(loopCounter);
                throw 'loop';
            }
        }),
        new Prim('rpush',    c=>_RST.push(pop())), // >r
        new Prim('rpop',    c=>push(_RST.pop())), // r>
        new Prim('rtos',    c=>push(_RST.at(-1))), // r@
        new Prim('depth', c=>push(_WST.length)),
        new Prim('exit',  c=>{ throw 'exit' }),
        new Prim('?',     c=>log(dict[pop()].val[0].toString(_base)+SPC)),
        // pops value associated with key -- for inspecting variables
        // potentially equivalent to : ? @  . ;
        new Prim('@',     c=>push(dict[pop()].val[0])),
        // pops key from tos, retrieves value from dict
        new Prim('!',     c=>{ let w=pop(); dict[w].val[0]=pop() }),
        // ( value key -- ) assigns value to key in dict
        // new Prim('+!',    c=>{ let w=pop(); dict[w].val[0]+=pop() }), 
        new Prim('n@',    c=>{ let i=pop(); let w=pop(); push(dict[w].val[i]) }),
        // ( i w -- value ) pops index i and key w, retreieves i-th element from dict[w].val -> tos
        new Prim('n!',    c=>{ let i=pop(); let w=pop(); dict[w].val[i]=pop() }),
        // ( x i w -- ) assigns value x to i-th element at key w 
        new Immd('[',        c=>_compi=false ),
        // switches interpreter from compile mode to interpret mode
        new Prim(']',        c=>_compi=true ),
        // switches interpreter from interpret mode to compile mode
        new Prim("'",        c=>{ let w=tok2w(); push(w.token) }),
        // parses next word token and pushes its token/identifer onto WST, compiles a reference to the word
        new Immd('exec',     c=>dict[pop()].exec()),
        // executes word, allows users to execute words immediately dring compilation/interpretation
        new Prim(':',        c=>_compi=dict.colon()),
        new Immd(';',        c=>_compi=false),
        new Immd('variable', c=>dict.colon() ? nvar(_dovar, 0) : null),
        //defines new variable with initial val of 0 if in a word def
        new Immd('constant', c=>dict.colon() ? nvar(_docon, pop()) : null),
        new Prim("create",   c=>dict.colon()),
        new Prim(',',        c=>{
            let pf = dict.at(-1).pf
            if (pf.length) pf[0].q.push(pop())
            else           nvar(_dovar, pop())
        }),
        new Prim('allot',    c=>{
            let w = dict.at(-1); nvar(_dovar, 0)
            for (let n=pop(), i=1; i<n; i++) w.val[i]=0
        }),
        new Immd('does>',    c=>{
            let w = new Code('_does', _does, false)
            w.token = dict.at(-1).token;
            compile(w)
        }),
        new Prim('to',       c=>tok2w().val[0]=pop()),
        new Prim('is',       c=>{
            if (!dict.colon()) return
            let n = INT(pop()), w = dict.at(-1), s = dict[n]
            w.pf = s.pf; w.xt = s.xt
        }),
        new Prim('here',     c=>push(dict.at(-1).token)),
        new Prim('.s',       c=>{ log(JSON.stringify(_WST)) }),
        new Prim('words',    c=>_words()),
        new Prim('dump',     c=>{ let n=pop(); _dump(pop(), n) }),
        new Prim('see',      c=>{
            let w=tok2w(); _see(w); //log(CR); // console.log(w); 
        }),
        new Prim('forget',   c=>{
            _fence=Math.max(tok2w().token, find('boot').token+1)
            //console.log("_fence"+_fence.toString())
            dict.splice(_fence)
        }),
        new Prim('abort',    c=>{ _RST.length = _WST.length = 0 }),
        new Prim('ms',       c=>{ let n = Date.now(); push(n) }),
        new Prim('delay',    c=>sleep(pop()).then(()=>{})),
        new Prim('date',     c=>push((new Date()).toDateString())),
        new Prim('time',     c=>push((new Date()).toLocaleTimeString())),
        new Prim('eval',     c=>eval(pop())),
        new Prim('boot',     c=>{
            dict.splice(_fence=find('boot').token+1)
            _RST.length = _WST.length = 0
            _base = 10
            log(`Ready`);
        })
    ];

    dict.colon = function() {
        let s = word();
        if (s==null) { log('name? '); return false }
        if (find(s) != null) log(s + ' redefined')
        dict.push(new Code(s, null, true))
        return true
    };
    dict.last = function() { return dict.at(-2).pf.at(-1) };

    this.WST = _WST;
    this.RST = _RST;
    this.dict = dict;
    this.base = ()=>{ return _base };

    this.outer = (tok)=>{
        let w = find(tok);
        if (w != null) {
            if (!_compi || w.immd) {
                try {
                    w.exec();
                } catch (e) {
                    log(e);
                    //log('\n')
                }
            } else {
                compile(w);
            }
            return;
        }
        let n = _base!=10 ? parseInt(tok, _base) : parseFloat(tok);
        if (isNaN(n) || !isNum(tok)) {
            log('Error: undefined word');
            _compi = false;
            return;
        }
        else if (_compi) {
            compile(new Code('', _dolit, n))
        }
        else push(n)
    };

    this.exec = (cmd)=>{
        // Clear output before each exec
        outputBuffer.length = 0;
        cmd.split('\n').forEach(r=>{
            _tib=r + SPC; _ntib=0;
            let tok = '';
            while ((tok=word()) != null) {
                this.outer(tok)
            }
        });
    };

    // Get the current output and clear the buffer
    this.getOutput = () => outputBuffer.join('');
        
    // Automatically load and execute the startup script
    const startupScriptElement = document.getElementById('forth-startup-code');
    if (startupScriptElement && startupScriptElement.type === 'application/forth') {
        const startupScript = startupScriptElement.textContent.trim();
        if (startupScript) {
            try {
                this.exec(startupScript);
            } catch (e) {
                console.error("Error executing startup script:", e);
            }
        }
    }

    // Flush buffered startup output
    if (startupOutputBuffer.length > 0) {
        startupOutputBuffer.forEach((line) => {
            outputBuffer.push(line);
            if (outputCallback) outputCallback(line);
        });
        startupOutputBuffer = null; // Clear temporary buffer
    }
};

</script>

<script id="optional-prims">
( todo: trim blanks on "SEE", "SEE" creates unnecessary nulls? )
: inc 1 + ;
: dec 1 - ;
: max 2dup - abs + 2 / ;
: min 2dup - abs - 2 / ;
: 2dup ( x1 x2 -- x1 x2 x1 x2) over over ;
: 2drop ( x1 x2 -- ) drop drop ; )
: 2over ( x1 x2 x3 x4 -- x1 x2 x3 x4 x1 x2 ) 3 pick 3 pick ; 
: 2swap ( x1 x2 x3 x4 -- x3 x4 x1 x2 ) >r >r swap r> r> swap ; 
</script>

<script id="forth-startup-code" type="application/forth">
boot
: inc 1 + ;
: dec 1 - ;
: 2dup ( x1 x2 -- x1 x2 x1 x2 ) over over ;
: max 2dup - abs + 2 / ;
: min 2dup - abs - 2 / ;
: eq = ;
: neq = ! ;
: u< ( u1 u2 -- f ) uint swap uint < ;
: u> ( u1 u2 -- f ) uint swap uint > ;
: get @ ; : set ! ; ( playing with names - comfortable with indirection slowdown for now) 
: +! ( value key -- ) @ + ! ;
.s
</script>

<style id="winbox-css">
@keyframes wb-fade-in {
    0% {
        opacity: 0;
    }
    to {
        opacity: 0.85;
    }
}
.no-animations * {
    animation: none !important;
    transition: none !important;
}

.winbox {
    position: fixed;
    left: 0;
    top: 25px;
    background: #0050ff;
    box-shadow: 0 0 0 rgba(0,0,0,.25), 0 0 0 rgba(0,0,0,.22);
    transition: width 0.1s,height 0.1s,left 0.1s,top 0.1s;
    transition-timing-function: cubic-bezier(.3,1,.3,1);
    contain: layout size;
    text-align: left;
    touch-action: none;
    padding: 10px;
    box-sizing: border-box;
}
.wb-body,
.wb-header {
    position: absolute;
    left: 0;
}
.wb-header {
    top: 0px;
    width: 100%;
    height: 0px;
    line-height: 25px;

    z-index: 1;

/* Hide the body content when minimized */
.winbox.min .wb-body {

}

.wb-sw {

}
.wb-nw {
    top: -5px;

}
.wb-ne,
.wb-sw {

}
.wb-ne {
    top: -5px;

}
.wb-se,
.wb-sw {
    bottom: -5px;

}
.wb-control {

.wb-control * {

.no-header .wb-header,

}
.winbox.max .wb-drag,
.winbox.min .wb-drag {

}
.wb-min, .wb-max, .wb-close, .wb-full {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    background-size: cover;

.wb-min {

}

.wb-max {

}

.wb-close {

}

.wb-full {

}

.winbox.min .wb-body~div,
.winbox.modal .wb-body~div,

    top: 0;

    pointer-events: none;

<script id="shell-logic">

const COMMAND_ALIASES = {
  "what": ["ls"],  
  "where": ["pwd"],
  "type": ["echo"],
  "trash": ["rm"],
  "view": ["cat"],
  "new": ["touch"],
  "new place": ["mkdir"],
  "go to": ["cd", "goto", "go"],
  "help": ["help"],
  "export": ["export"],
  "import": ["import"],
  "tree": ["tree", "map"],
  "clear": ["clear"],
  "forth": ["forth"]
};

function findPrimaryName(command) {
  for (let primary in COMMAND_ALIASES) {
    if (primary === command || COMMAND_ALIASES[primary].includes(command)) {
      return primary;
    }
  }
  return command;
}

// 2) THE SHELL CLASS
class Shell {
    constructor(printCallback, appendHistoryCallback) {
        this.printCallback = printCallback;
        this.appendHistoryCallback = appendHistoryCallback;        
        if (useLocalStorage) {
            this.filesystem = this.loadFileSystem() || { '/': {} };
        } else {
            this.filesystem = { '/': {} };
        }
        this.currentPath = '/';
    }

    // Local Storage Logic
    loadFileSystem() {
        if (!useLocalStorage) return null;  
        return JSON.parse(localStorage.getItem('bridge-filesystem'));
    }
    saveFileSystem() {
        if (!useLocalStorage) return;  
        localStorage.setItem('bridge-filesystem', JSON.stringify(this.filesystem));
    }

    // Print
    print(text) {
        if (this.printCallback) {
            this.printCallback(text + "\n");  
        }
    }

    // Parse input
    parseInput(input) {
        const args = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < input.length; i++) {
            const char = input[i];
            if (char === '"' || char === "'") {
                inQuotes = !inQuotes;
            } else if (char === ' ' && !inQuotes) {
                if (current !== '') {
                    args.push(current);
                    current = '';
                }
            } else {
                current += char;
            }
        }
        if (current !== '') {
            args.push(current);
        }
        return args;
    }

    getPrompt() {
        return `${this.currentPath} >`;
    }

    // 3) MAIN COMMAND PROCESSOR
    processCommand(inputLine) {
        // parse arguments
        const args = this.parseInput(inputLine.trim());
        // must be 'let' so we can reassign
        let command = args[0];
        const rest = args.slice(1);

        // unify command with alias
        command = findPrimaryName(command);

        switch (command) {
          // Export logic
          case 'export':
            if (rest.includes('-h') || (rest[0] === 'with' && rest[1] === 'history')) {
              this.exportFileSystem(true);
            } else {
              this.exportFileSystem(false);
            }
            return null;

          // Import logic
          case 'import':
            this.importFileSystem(rest.join(' '));
            return null;

          // Renamed commands
          case 'what':
            this.cmdWhat();
            break;
          case 'where':
            this.cmdWhere();
            break;
          case 'type':
            this.cmdType(rest);
            break;
          case 'trash':
            this.cmdTrash(rest[0]);
            break;
          case 'view':
            this.cmdView(rest[0]);
            break;
          case 'new':
            if (rest[0] === 'place') {
              this.cmdNewPlace(rest[1]);
            } else {
              this.cmdNew(rest[0]);
            }
            break;
          case 'go to':
            this.cmdGoTo(rest[0]);
            break;

          // Unchanged commands
          case 'help':
            this.help();
            break;
          case 'tree':
            this.tree();
            break;
          case 'clear':
            return { command: 'clear' };
          case 'forth':
            return { command: 'forth' };

          // Default / unknown
          default:
            if (command) {
              this.print(`Command not found: ${args[0]}`);
            }
        }
        return null;
    }

    // 4) IMPLEMENTATION OF COMMANDS
    cmdWhat() {
        const dir = this.getDirectory(this.currentPath);
        if (!dir) {
            this.print(`No such place: ${this.currentPath}`);

        }

        }

            }

    }

    cmdGoTo(path) {

        } else {

        }
    }

    cmdNewPlace(name) {
        if (!name) {

        }
        const dir = this.getDirectory(this.currentPath);

            dir[name] = {};
            this.saveFileSystem();
        } else {
            this.print(`new place: cannot create place '${name}': thing exists`);
        }
    }

    cmdNew(name) {
        if (!name) {

        }

    importFileSystem(jsonString) {
        if (!jsonString) {
            this.print("Usage: export [-h] or 'with history'");
            return;
        }
        try {
            const fsObj = JSON.parse(jsonString);
            if (typeof fsObj === 'object') {

                if (fsObj.filesystem) {

            } else {
                this.print("Invalid image for filesystem import.");
            }
        } catch (e) {
            this.print("Error parsing image for import.");
        }
    }

    // 6) Internals
    getDirectory(path) {
        const parts = path.split('/').filter(Boolean);
        let dir = this.filesystem['/']; 
        for (const part of parts) {
            if (dir[part] && typeof dir[part] === 'object') {
                dir = dir[part];
            } else {
                return null;
            }
        }
        return dir;
    }

    resolvePath(path) {
        if (path.startsWith('/')) {
            return path;
        }
        const currentParts = this.currentPath.split('/').filter(Boolean);
        const newParts = path.split('/').filter(Boolean);
        const fullPath = [...currentParts, ...newParts];
        const resolvedParts = [];

        for (const part of fullPath) {
            if (part === '..') {
                resolvedParts.pop();
            } else if (part !== '.') {
                resolvedParts.push(part);
            }
        }
        return '/' + resolvedParts.join('/');
    }

    static cycleWindowFocus() {

        const currentInstance = instances[activeInstanceIndex];
        const associatedWinBox = WinBox.stack().find(win => win.body === currentInstance.container);

        if (associatedWinBox) {

    handleHistoryNavigation(direction) {
    if (direction === 'up') {

// shell hook in
scrollClear() {
    // 1) Grab the visible height of the output buffer
    const bufferHeight = this.outputBuffer.clientHeight;

    // 2) Grab the line height from computed styles
    let lineHeight = parseFloat(window.getComputedStyle(this.outputBuffer).lineHeight);
    if (!lineHeight || isNaN(lineHeight)) {
        // Fallback if lineHeight is empty or non-numeric
        lineHeight = 20;
    }
    
    // 3) Calculate the number of blank lines needed
    const linesToPush = Math.ceil(bufferHeight / lineHeight);

    // 4) Append that many blank lines
    for (let i = 0; i < linesToPush; i++) {
        this.appendOutput('');  // just an empty string
    }
}

executeCommandInCurrentMode(command, fromTextPane = false) {
    // Always print what the user entered
    this.appendOutput(command, "#555555");

    // If we are currently in the VM
    if (this.currentVM) {
        this.currentVM.exec(command);
        if (command === "exit") {
            this.currentVM = null;
            // We are back to the shell now
        }
        return;
    }

    // Otherwise, we are in the shell
    const result = this.shell.processCommand(command);
    if (result && result.command === 'clear') {
    	this.scrollClear();
        return;
    }
    
    if (result && result.command === 'forth') {
        // The shell signaled we should boot into forth
        // Provide an outputCallback so VM output prints immediately:
        this.currentVM = new ForthVM((text) => {
            this.appendOutput(text, "black");
        });
        return;
    }}


    // Handle history navigation in all modes
navigateHistory(direction) {
    if (direction === 'up') {
        if (this.historyIndex > 0) {
            this.historyIndex--;
        }
    } else if (direction === 'down') {
        if (this.historyIndex < this.commandHistory.length) {
            this.historyIndex++;
        }
    }

    // If index is at length, it means "new empty entry"
    if (this.historyIndex >= this.commandHistory.length) {
        return '';
    }
    return this.commandHistory[this.historyIndex] || '';
}

    adjustTextareaHeight() {
        this.inputBuffer.style.height = 'auto'; // Reset height to recalculate
        const maxHeight = this.defaultLineHeight * this.maxRows; // Calculate max height based on rows
        const newHeight = Math.max(this.inputBuffer.scrollHeight, this.initialHeight); // Ensure minimum height
        this.inputBuffer.style.height = `${Math.min(newHeight, maxHeight)}px`; // Apply constraints
    }

    resetTextareaHeight() {
        this.inputBuffer.style.height = `${this.initialHeight}px`; // Reset to the cached initial height
    }

    appendOutput(content, color = 'black') {
        this.outputBuffer.innerHTML += `<span style="color: ${color};">${content}</span><br>`;
        this.outputBuffer.scrollTop = this.outputBuffer.scrollHeight;
    }
}

            // Reset to single-line height initially
            this.inputBuffer.style.height = `${this.defaultLineHeight}px`;

            // Trigger a recalculation for multiple lines if needed
            this.adjustTextareaHeight();
        }
     
        
        // Function to add or remove the small-split class to target elements
        function updateFontClass(win) {
            const screenWidth = window.innerWidth;
            const currentWidth = win.width / screenWidth;

            const inputBuffer = win.body.querySelector('#inputBuffer');
            const textPane = win.body.querySelector('#textPane');
            const outputBuffer = win.body.querySelector('#outputBuffer');

            // Threshold for applying small-split styling
            const applySmallSplit = currentWidth < 0.49; //>

            // Apply or remove 'small-split' on all elements
            [textPane, outputBuffer].forEach((el) => { // removed inputBuffer here until we can figure out updateInputBufferHeight
                if (el) {
                    if (applySmallSplit) {
                        el.classList.add('small-split');
                    } else {
                        el.classList.remove('small-split');
                    }
                }
            });
        }

        // Function to adjust the window size/position based on the direction
        function adjustWindow(win, direction) {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // Extract current dimensions and state
            let { x, y, width, height, splitState, normalX, normalY, normalWidth, normalHeight } = win;
            width /= screenWidth;
            height /= screenHeight;
            x /= screenWidth;
            y /= screenHeight;

            // Check if the window is in normal mode
            if (!splitState || !splitState.applied) {
                if (!splitState) {
                    splitState = { applied: false };
                }
                splitState.applied = true;

                // Save the current normal state if not already tracked
                win.normalX = x;
                win.normalY = y;
                win.normalWidth = width;
                win.normalHeight = height;

                switch (direction) {
                    case "left":
                        x = 0;
                        y = 0;
                        width = horizontalSplitLevels[0]; // Largest horizontal split level
                        height = 1; // Full height
                        break;
                    case "right":
                        x = 1 - horizontalSplitLevels[0];
                        y = 0;
                        width = horizontalSplitLevels[0]; // Largest horizontal split level
                        height = 1; // Full height
                        break;
                    case "up":
                        y = 0;
                        x = 0;
                        height = verticalSplitLevels[0]; // Largest vertical split level
                        width = 1; // Full width
                        break;
                    case "down":
                        y = 1 - verticalSplitLevels[0];
                        x = 0;
                        height = verticalSplitLevels[0]; // Largest vertical split level
                        width = 1; // Full width
                        break;
                }
            } else {
                // Determine the edge to adjust and whether to resize or move
                switch (direction) {
                    case "left":
                        if (x === 0) {
                            width = getNextSplitLevel(width, horizontalSplitLevels, true); // Decrease width
                            if (width === horizontalSplitLevels[horizontalSplitLevels.length - 1] && cycleToNormal) {
                                splitState.applied = false; // Return to normal
                                x = win.normalX;
                                y = win.normalY;
                                width = win.normalWidth;
                                height = win.normalHeight;
                                break;
                            }
                        } else {
                            x = Math.max(x - width, 0); // Move left if space allows
                        }
                        break;
                    case "right":
                        if (x + width >= 1) {
                            width = getNextSplitLevel(width, horizontalSplitLevels, true); // Decrease width
                            x = 1 - width; // Align right edge
                            if (width === horizontalSplitLevels[horizontalSplitLevels.length - 1] && cycleToNormal) {
                                splitState.applied = false; // Return to normal
                                x = win.normalX;
                                y = win.normalY;
                                width = win.normalWidth;
                                height = win.normalHeight;
                                break;
                            }
                        } else {
                            x = Math.min(x + width, 1 - width); // Move right if space allows
                        }
                        break;
                    case "up":
                        if (y === 0) {
                            height = getNextSplitLevel(height, verticalSplitLevels, true); // Decrease height
                            if (height === verticalSplitLevels[verticalSplitLevels.length - 1] && cycleToNormal) {
                                splitState.applied = false; // Return to normal
                                x = win.normalX;
                                y = win.normalY;
                                width = win.normalWidth;
                                height = win.normalHeight;
                                break;
                            }
                        } else {
                            y = Math.max(y - height, 0); // Move up if space allows
                        }
                        break;
                    case "down":
                        if (y + height >= 1) {
                            height = getNextSplitLevel(height, verticalSplitLevels, true); // Decrease height
                            y = 1 - height; // Align bottom edge
                            if (height === verticalSplitLevels[verticalSplitLevels.length - 1] && cycleToNormal) {
                                splitState.applied = false; // Return to normal
                                x = win.normalX;
                                y = win.normalY;
                                width = win.normalWidth;
                                height = win.normalHeight;
                                break;
                            }
                        } else {
                            y = Math.min(y + height, 1 - height); // Move down if space allows
                        }
                        break;
                }
            }

            // Apply the changes
            win.move(x * screenWidth, y * screenHeight);
            win.resize(width * screenWidth, height * screenHeight);
            win.splitState = splitState; // Save split state
            
            updateFontClass(win);
        }
            
        

        // Key handler for resizing/moving windows
        document.addEventListener("keydown", (event) => {
            const currentWin = WinBox.stack().find((win) => win.focused);
            if (event.altKey) {
                event.preventDefault();
                switch (event.key) {
                    case "3": // Window focus cycling
                        event.preventDefault();
                        InterpreterInterface.cycleWindowFocus();
                        break;
                    case "h":
                        adjustWindow(currentWin, "left");
                        break;
                    case "l":
                        adjustWindow(currentWin, "right");
                        break;
                    case "k":
                        adjustWindow(currentWin, "up");
                        break;
                    case "j":
                        adjustWindow(currentWin, "down");
                        break;
                    case "m": // Minimize or unminimize
                        event.preventDefault();
                        InterpreterInterface.minimizeCurrentWindow();
                        break;
                    case "r": // restore
                        event.preventDefault();
                        InterpreterInterface.unminimizeMostRecent();
                        break;
                    case "b": // maximize
                        event.preventDefault();
                        InterpreterInterface.toggleMaximizeCurrentWindow();
                        break;
                    case "f": // fullscreen
                        event.preventDefault();
                        InterpreterInterface.toggleFullscreenCurrentWindow();
                        break;
                    case "n": // Create a new window
                        event.preventDefault();
                        openProject('interpreter');
                        break;
                }
            }
        });

////////////////////////////// window creation
 
function openProject(projectId) {
    const template = document.getElementById(projectId);
    if (!template) {
        console.error(`Template for projectId ${projectId} not found.`);
        return;
    }

    const instanceNumber = InterpreterInterface.instances.length + 1; // Determine instance number

    const win = new WinBox({
        title: `#${instanceNumber}`,
        html: template.innerHTML,
        width: "60%",
        height: "80%",
        max: false, // TODO: messes with interaction layer positioning
        x: "center",
        y: "center",
        background: "#333",
        onresize: function (width, height) {
            // Check if the width exceeds 95% of the viewport width
            const viewportWidth = window.innerWidth;
            const isMaximized = width / viewportWidth > 0.95;

            const container = this.body.querySelector('.window-container');
            if (isMaximized) {
                container.classList.add('maximized');
            } else {
                container.classList.remove('maximized');
            }
        },
        onclose: () => {
            // Remove the instance when closed
            InterpreterInterface.instances = InterpreterInterface.instances.filter(
                (instance) => instance.instanceNumber !== instanceNumber
            );
        },
    });

    const interpreter = new Interpreter();
    const associatedInterface = new InterpreterInterface(win.body, interpreter, instanceNumber);
    win.associatedInterface = associatedInterface; // Explicitly associate the InterpreterInterface with this WinBox
    associatedInterface.inputBuffer.focus();
    console.log(`Created window ${win.id} with associated interface`, associatedInterface);
}
